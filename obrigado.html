<!doctype html>
<html lang="pt">
<head>

    p { margin: 16px 0 0; color: #d1d1d1; line-height: 1.55; }
    a { display: grid; place-items: center; min-height: 50px; margin-top: 26px; padding: 12px 16px; border-radius: 999px; background: #25d366; color: #063918; font-weight: 750; text-align: center; text-decoration: none; }
    a:focus-visible { outline: 2px solid #ffe5b8; outline-offset: 4px; }

</head>
<body>
